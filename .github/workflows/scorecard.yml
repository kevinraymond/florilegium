# OpenSSF Scorecard checks this repository's security practices (pinned actions, token
# permissions, branch rules, a security policy...) and publishes the score behind the
# README's badge. Scorecard's API accepts results only from a workflow shaped like its own
# example: no top-level env or defaults, no write permission outside this job, and only
# actions from its approved list. https://github.com/ossf/scorecard-action
name: scorecard
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # the results go to the Security tab as code scanning alerts
      id-token: write         # publishing the results needs GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
