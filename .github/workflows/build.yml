name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Every action is pinned to a full commit SHA (the version is in the comment beside it);
# Dependabot proposes new ones once a month. Jobs get only the permissions they need.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # florilegium-svg.lua must draw the same page under every Lua (texlua, 5.3, 5.4 and the playground's
  # wasmoon); a few seconds, so a pull request hears about a broken page first. Before that,
  # florilegium.sty and every Lua file must name the same release, and on a v* tag the tag's,
  # so that no release is drafted from files that say another version; and the Lua must pass
  # luacheck (.luacheckrc).
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every file names the same release (on a tag, the tag's)
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: tools/versioncheck.sh ${TAG:+"$TAG"}
      - name: install Lua 5.3, 5.4 and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 lua5.4 lua-check > /dev/null
      - name: the Lua passes luacheck
        run: luacheck .
      - name: the same pages under both
        run: tools/svgcheck.sh lua5.3 lua5.4
      - name: every sampled species and visitor keeps the rules, and the TikZ tables are current
        run: lua5.3 tools/speciescheck.lua 4000 && lua5.4 tools/speciescheck.lua 4000

  # The four documents, which a release carries, and pages that are only checked: the
  # species sheet (the Lua engine under LuaLaTeX, by the library's default; pure TikZ is the
  # tikz jobs'), and the specimen sheets and the ornaments, which draw through
  # \florilegiumdraw and \florilegiumornament, which read pgf's transform from its internal
  # macros (florilegium.lua: sync_transform), so a pgf that renamed them would fail here and
  # not in someone's document.
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the documents, specimen sheets and ornaments (lualatex)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: |
            florilegium.tex
            florilegium-grow.tex
            showcase.tex
            spread.tex
            specimen.tex
            specimen-geometric.tex
            ornaments.tex
            specimen-tikz.tex
            florilegium-doc.tex
          latexmk_use_lualatex: true
          # Lua does pgfmath's arithmetic exactly where the species need it (pgfmathcheck), and
          # the TikZ library and the Lua sample the same species, visitors, windows of
          # tracery and shells (tikzcheck); the tikz jobs below compare what the two engines draw
          post_compile: >-
            texlua tools/pgfmathcheck.lua 20000 &&
            texlua tools/tikzcheck.lua 1 1000 &&
            texlua tools/tikzcheck.lua 1 1000 lualatex v:any &&
            texlua tools/tikzcheck.lua 1 1000 lualatex t:any &&
            texlua tools/tikzcheck.lua 1 1000 lualatex s:any
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: florilegium-pdfs
          if-no-files-found: error
          path: |
            florilegium.pdf
            florilegium-grow.pdf
            showcase.pdf
            spread.pdf

  # Whether a pull request changes anything but Markdown. The tikz jobs read no .md file, so a
  # pull request that changes only Markdown skips them. pdfs and zip still run, since the manual
  # and the zip take the README and docs/. A skipped job counts as passed, so this never holds
  # up a merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request checks out its merge commit, whose first parent is the base branch, so
      # the diff between the two is what the pull request changes. A manual run always runs
      # tikz, and a push to main or a tag never does (the tikz jobs' own condition).
      - name: whether anything but Markdown changed
        id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then
              code=false
            fi
            printf '%s\n' "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # The species in pure TikZ, which promise pdfLaTeX too, one family of drawings a job, on
  # every core of its runner (tools/tikzcheck-ci.sh, which latex-action runs as its compiler,
  # in its TeX Live; pre_compile names the family). Each of the family's pages of the specimen
  # sheet is typeset under pdflatex in a run of its own, all at once, with the main memory a
  # strip of plants needs (specimen-tikz.tex says why); a page fails on any error, and on the
  # library's warning that it could not patch pgf's number scanner. Beside them tikzcheck draw
  # builds the family's pics with engine=tikz and engine=lua, each in as many runs as there are
  # cores, and compares their renders (pdftoppm, which the image lacks: poppler-utils). Pure
  # TikZ is slow. All the families in one job took over 40 minutes on the runner, and each new
  # one made it longer; a job each keeps the wait at the slowest family's, the plants (the
  # specimen sheet's two strips). They run on pull requests that change more than Markdown and
  # by hand. A push to main is the merge of a pull request that ran them, and a tag doesn't
  # need them either.
  tikz:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        family: [plants, fern, visitors, tracery, shells]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the family's pages of the species sheet in pure TikZ (pdflatex), and its pics in both engines compared
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: tools/tikzcheck-ci.sh
          compiler: sh
          args: -e
          extra_system_packages: poppler-utils
          pre_compile: export TIKZCHECK_FAMILY=${{ matrix.family }}

  # l3build's regression tests (build.lua, testfiles/): each test typesets a few pages and logs
  # the md5 of every drawing on them, so a change that moves one point of one drawing fails
  # here. The logs were recorded with Ubuntu 24.04's TeX Live 2023, as tools/Dockerfile
  # installs it, so the tests run there and not in latex-action's newer TeX Live (another
  # TeX Live may set the text differently, and a heading's flower moves with it).
  l3build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install TeX Live 2023 as tools/Dockerfile does
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-luatex texlive-latex-recommended \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern cm-super > /dev/null
      - name: every test logs what was recorded
        run: l3build check
      - name: what differs
        if: failure()
        run: cat build/l3build/test/*.diff

  # The PostScript port (postscript/florilegium.ps) through Ghostscript, about 40 runs in a few
  # seconds: the pages postscript/expected.txt records, every spelling of an option, the clock
  # seed, the 32-bit limit on seeds, and the PDF and raster devices (postscript/check.sh says
  # what each check means). expected.txt was recorded with Ghostscript 10.05.1; Ubuntu 24.04's
  # 10.02.1 draws the same pages, and a version that paints a point differently only warns, as
  # long as every page grows the same garden.
  postscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Ghostscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ghostscript > /dev/null
      - name: the port draws what expected.txt records
        run: postscript/check.sh

  # The package as one folder, for CTAN and the release (tools/zip.py lists what goes in): the
  # manual typeset with Ubuntu 24.04's TeX Live 2023, as tools/Dockerfile installs it, and both
  # dated by the commit, so make zip RUN=tools/in-docker gives the same bytes from the same
  # commit. Then the zip is unpacked into an empty folder and the grown document, the manual and
  # a pure-TikZ flower under pdfLaTeX are built there, so a file it lacks fails here.
  zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install TeX Live 2023 as tools/Dockerfile does
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-luatex texlive-latex-recommended \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern cm-super > /dev/null
      - name: the manual and the zip
        run: make zip && cp build/florilegium.zip .
      - name: unpacked into an empty folder, it builds
        run: |
          mkdir "$RUNNER_TEMP/unzipped"
          cd "$RUNNER_TEMP/unzipped"
          unzip -q "$GITHUB_WORKSPACE/florilegium.zip"
          cd florilegium
          lualatex -interaction=nonstopmode -halt-on-error florilegium-grow.tex > /dev/null
          lualatex -interaction=nonstopmode -halt-on-error florilegium-doc.tex > /dev/null
          printf '%s\n' '\documentclass{article}' '\usepackage{tikz}' '\usetikzlibrary{florilegium}' \
            '\begin{document}' '\tikz\pic{florilegium flower={seed=7, role=hero, size=3cm}};' '\end{document}' > flower.tex
          pdflatex -interaction=nonstopmode -halt-on-error flower.tex > /dev/null
          ls -l ./*.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: florilegium-zip
          if-no-files-found: error
          path: |
            florilegium.zip
            florilegium-doc.pdf

  # A release starts with a tag: git tag -a v2.0.0 -m v2.0.0 && git push origin v2.0.0, after a
  # commit that sets the version everywhere (CLAUDE.md, Releases); the lua job stops a tag
  # that florilegium.sty and the Lua files don't agree with, the l3build job one whose
  # drawings moved without their logs being recorded again, the postscript job one whose
  # PostScript port grows another garden, and the zip job one whose zip lacks a file. The tikz
  # jobs don't run on a tag, since the pull request ran them on the tree it merged. This
  # job signs a build provenance attestation for the PDFs, the manual and florilegium.zip built
  # from that tag and opens a draft release with them attached, along with the attestation
  # itself as florilegium-pdfs.sigstore.json. The notes are written by hand, and publishing the draft
  # makes the release immutable. Check a PDF with
  #   gh attestation verify florilegium.pdf --repo kevinraymond/florilegium
  # and add --bundle florilegium-pdfs.sigstore.json to check it against the attached file
  # instead of GitHub's copy. OpenSSF Scorecard counts a release as signed by that file.
  # The only job that may write.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # tikz doesn't run on a tag: the pull request ran it on the tree it merged
    needs: [lua, pdfs, l3build, postscript, zip]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write           # create the draft release
      id-token: write           # sign the attestation (Sigstore, through GitHub's OIDC token)
      attestations: write       # store it
      artifact-metadata: write  # record the PDFs it covers
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: florilegium-pdfs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: florilegium-zip
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            *.pdf
            florilegium.zip
      - name: a draft release with the PDFs and their attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" florilegium-pdfs.sigstore.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.pdf florilegium.zip florilegium-pdfs.sigstore.json --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./*.pdf florilegium.zip florilegium-pdfs.sigstore.json --draft --verify-tag \
              --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: render six seeds
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: gallery.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils
          post_compile: >-
            python3 tools/gallery.py --seeds 1 2 3 4 5 6 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --inks 2456C4 5B2A1F 2F6B4F 8E1B3A 4B3B8F 1D6E7A --jobs 2 &&
            python3 tools/gallery.py --seed 6 --ages 0 0.33 0.67 1 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --themes flora geometric math --jobs 2 &&
            python3 tools/gallery.py --seed 6 --options density=1 density=0.5 density=0.2 density=0.05 intensity=0.5 --jobs 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/
