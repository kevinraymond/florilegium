name: build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: authored and grown (lualatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            florilegium.tex
            florilegium-grow.tex
            showcase.tex
            spread.tex
          latexmk_use_lualatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: florilegium-pdfs
          path: |
            florilegium.pdf
            florilegium-grow.pdf
            showcase.pdf
            spread.pdf

  # A release is written and published by hand (gh release create, no files);
  # this attaches the PDFs built from its tag. The only job that may write.
  release:
    runs-on: ubuntu-latest
    needs: pdfs
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: florilegium-pdfs
      - name: attach the PDFs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.pdf --clobber --repo "$GITHUB_REPOSITORY"

  gallery:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: render six seeds
        uses: xu-cheng/latex-action@v3
        with:
          root_file: gallery.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils
          post_compile: >-
            python3 tools/gallery.py --seeds 1 2 3 4 5 6 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --inks 2456C4 5B2A1F 2F6B4F 8E1B3A 4B3B8F 1D6E7A --jobs 2 &&
            python3 tools/gallery.py --seed 6 --ages 0 0.33 0.67 1 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --themes flora geometric math --jobs 2 &&
            python3 tools/gallery.py --seed 6 --options density=1 density=0.5 density=0.2 density=0.05 intensity=0.5 --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery/
