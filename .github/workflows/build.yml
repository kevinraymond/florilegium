name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Every action is pinned to a full commit SHA (the version is in the comment beside it);
# Dependabot proposes new ones once a month. Jobs get only the permissions they need.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # svg.lua must draw the same page under every Lua (texlua, 5.3, 5.4 and the playground's
  # wasmoon); a few seconds, so a pull request hears about a broken page first
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Lua 5.3 and 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 lua5.4 > /dev/null
      - name: the same pages under both
        run: tools/svgcheck.sh lua5.3 lua5.4

  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: authored and grown (lualatex)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: |
            florilegium.tex
            florilegium-grow.tex
            showcase.tex
            spread.tex
          latexmk_use_lualatex: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: florilegium-pdfs
          if-no-files-found: error
          path: |
            florilegium.pdf
            florilegium-grow.pdf
            showcase.pdf
            spread.pdf

  # A release starts with a tag: git tag -a v1.3 -m v1.3 && git push origin v1.3. This job
  # signs a build provenance attestation for the PDFs built from that tag and opens a draft
  # release with them attached, along with the attestation itself as
  # florilegium-pdfs.sigstore.json. The notes are written by hand, and publishing the draft
  # makes the release immutable. Check a PDF with
  #   gh attestation verify florilegium.pdf --repo kevinraymond/florilegium
  # and add --bundle florilegium-pdfs.sigstore.json to check it against the attached file
  # instead of GitHub's copy. OpenSSF Scorecard counts a release as signed by that file.
  # The only job that may write.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lua, pdfs]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write           # create the draft release
      id-token: write           # sign the attestation (Sigstore, through GitHub's OIDC token)
      attestations: write       # store it
      artifact-metadata: write  # record the PDFs it covers
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: florilegium-pdfs
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '*.pdf'
      - name: a draft release with the PDFs and their attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" florilegium-pdfs.sigstore.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.pdf florilegium-pdfs.sigstore.json --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./*.pdf florilegium-pdfs.sigstore.json --draft --verify-tag \
              --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: render six seeds
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: gallery.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils
          post_compile: >-
            python3 tools/gallery.py --seeds 1 2 3 4 5 6 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --inks 2456C4 5B2A1F 2F6B4F 8E1B3A 4B3B8F 1D6E7A --jobs 2 &&
            python3 tools/gallery.py --seed 6 --ages 0 0.33 0.67 1 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --themes flora geometric math --jobs 2 &&
            python3 tools/gallery.py --seed 6 --options density=1 density=0.5 density=0.2 density=0.05 intensity=0.5 --jobs 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/
