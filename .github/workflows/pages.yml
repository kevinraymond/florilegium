name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', '*.lua', 'tools/svgcheck.sh', 'tools/sri.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # the playground (web/) and the package's Lua beside it, published to GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
      pages: write    # deploy to Pages
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Lua still draws a page without TeX
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 > /dev/null
          tools/svgcheck.sh lua5.4
      - name: the CDN files still have the hashes the playground pins
        run: tools/sri.sh
      - name: assemble the site
        run: |
          mkdir _site
          cp -r web/. _site/
          cp ./*.lua LICENSE _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
