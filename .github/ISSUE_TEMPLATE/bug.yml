name: Something is wrong
description: The package, the PDFs, florilegium-svg.lua or the playground does something it shouldn't.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot or a crop of the page helps a lot with anything visual.
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: The smallest document that shows it
      description: Or the playground's address (it holds every setting), or the florilegium-svg.lua command line.
      render: latex
  - type: input
    id: tex
    attributes:
      label: TeX Live version
      description: The first line of `lualatex --version`.
      placeholder: This is LuaHBTeX, Version 1.17.0 (TeX Live 2023)
  - type: input
    id: version
    attributes:
      label: florilegium version
      description: The release, or the commit if you use main. The log shows the package date.
      placeholder: v1.3
  - type: textarea
    id: log
    attributes:
      label: The relevant part of the log
      description: Lines starting with `florilegium:` and any error. Leave it empty for a browser problem, and name the browser instead.
      render: text
